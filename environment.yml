name: scramblemark

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - ffmpeg
  - cmake
  - ninja
  - cxx-compiler
  - pyaudio=0.2.14

  # Match the CUDA/PyTorch versions used by the working environment.
  - pytorch=2.4.1
  - torchvision=0.19.1
  - torchaudio=2.4.1
  - pytorch-cuda=11.8

  - pip:
      - setuptools<81

      # Numerical and audio stack
      - numpy==1.23.5
      - scipy==1.11.4
      - scikit-learn==1.7.1
      - matplotlib==3.8.4
      - seaborn==0.13.2
      - librosa==0.9.2
      - numba==0.60.0
      - llvmlite==0.43.0
      - soundfile==0.13.1
      - resampy==0.4.3
      - pydub==0.25.1
      - audiomentations==0.28.0
      - PyWavelets==1.8.0
      - pyworld==0.3.5
      - julius==0.2.7
      - kornia==0.6.9
      - Resemblyzer==0.1.1.dev0
      - noisereduce==3.0.3
      - webrtcvad==2.0.10
      - opencv-python-headless==4.10.0.84
      - pesq==0.0.4
      - wget==3.2

      # Models, configuration, optimization, and asset downloads
      - huggingface-hub==0.30.2
      - omegaconf==2.3.0
      - cma==4.4.2
      - PyYAML==6.0.3
      - rich==13.3.2
      - tqdm==4.68.3
      - requests==2.34.2
      - gdown>=6.0.0,<7

      # Local pitch-shifting/time-stretching implementation.
      - -e ./python-stretch
